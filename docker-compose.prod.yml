# Production overrides for AWS GPU deployment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  postgres:
    restart: always
    ports: []  # don't expose DB port publicly
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  redis:
    restart: always
    ports: []  # don't expose Redis port publicly
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  backend:
    restart: always
    env_file: .env.prod
    environment:
      # Reset the base file's dev-only overrides: no --reload (perf/safety
      # with multiple workers), and real AWS S3 (empty endpoint_url) instead
      # of the dev MinIO container — .env.prod supplies the real credentials.
      - UVICORN_RELOAD=false
      - S3_ENDPOINT_URL=
    volumes:
      # Production: no source-code bind-mount — use the built image
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
      - musetalk_models:/app/models  # persist downloaded models across restarts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  frontend:
    restart: always
    env_file: .env.prod
    # Reset the base file's dev override back to the Dockerfile's production
    # server (the built .next output), not the dev/hot-reload server.
    command: npm start
    volumes:
      # Production: no source-code bind-mount — use the built image
      - /app/node_modules
      - /app/.next
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  celery-worker:
    restart: always
    env_file: .env.prod
    environment:
      # Real AWS S3 (empty endpoint_url) instead of the dev MinIO container —
      # .env.prod supplies the real credentials.
      - S3_ENDPOINT_URL=
    volumes:
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
      - musetalk_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  flower:
    # Disable Flower in production (security risk)
    profiles: ["dev"]

  minio:
    # Disable MinIO in production — backend/celery-worker use real AWS S3
    # (see the S3_ENDPOINT_URL reset above), not the dev object-storage stub.
    profiles: ["dev"]

  nginx:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

volumes:
  musetalk_models:
    driver: local
