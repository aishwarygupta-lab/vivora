services:
  postgres:
    image: postgres:15-alpine
    container_name: avatar-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-avatar_db}
      POSTGRES_USER: ${DATABASE_USER:-avatar_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-avatar_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - avatar-network

  redis:
    image: redis:7-alpine
    container_name: avatar-redis
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - avatar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These override .env because they use Docker service hostnames, not localhost
      - DATABASE_URL=postgresql://${DATABASE_USER:-avatar_user}:${DATABASE_PASSWORD:-change_this_password}@postgres:5432/${DATABASE_NAME:-avatar_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY come from .env (env_file
      # above) rather than being hardcoded here, so docker-compose.prod.yml's
      # .env.prod real AWS credentials aren't clobbered by a compose-level
      # override (environment: always wins over env_file for the same key).
      - USE_LOCAL_STORAGE=true
      - S3_ENDPOINT_URL=http://minio:9000
      # Dev mode: --reload watches the bind-mounted source below and restarts
      # on file changes — code edits take effect without a rebuild.
      - UVICORN_RELOAD=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
        # Optional: minio is profile-gated out in docker-compose.prod.yml
        # (real AWS S3 there instead), so don't fail if it's not part of
        # the running project.
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - avatar-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the client bundle at BUILD time,
      # so they must be passed as build args — runtime `environment` alone
      # has no effect on the compiled JS.
      args:
        - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
        - NEXT_PUBLIC_WS_URL=${WS_URL:-ws://localhost:8000}
        - NEXT_PUBLIC_SITE_URL=${FRONTEND_URL:-http://localhost:3000}
        - NEXT_PUBLIC_S3_BUCKET_DOMAIN=${S3_BUCKET_NAME}
        - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
    container_name: avatar-frontend
    # Dev mode: run the Next dev server (hot reload) instead of the Dockerfile's
    # production `npm start`, against the bind-mounted source below — code
    # edits take effect without a rebuild.
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${WS_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_S3_BUCKET_DOMAIN=${S3_BUCKET_NAME}
      - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - avatar-network
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-avatar_user}:${DATABASE_PASSWORD:-change_this_password}@postgres:5432/${DATABASE_NAME:-avatar_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_LOCAL_STORAGE=true
      - S3_ENDPOINT_URL=http://minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - avatar_cache:/tmp/avatars
      - video_cache:/tmp/videos
      - audio_cache:/tmp/audio
      - voice_profiles:/app/voice_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - avatar-network
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar-flower
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - avatar-network
    restart: unless-stopped

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: avatar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - avatar-network
    restart: unless-stopped

  # S3-compatible object storage — the real storage backend for dev (backend/
  # celery-worker set USE_LOCAL_STORAGE=false + S3_ENDPOINT_URL=http://minio:9000
  # above). Disabled in production (see docker-compose.prod.yml), where the
  # backend talks to real AWS S3 via .env.prod instead.
  minio:
    image: minio/minio:latest
    container_name: avatar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - avatar-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  avatar_cache:
    driver: local
  video_cache:
    driver: local
  audio_cache:
    driver: local
  voice_profiles:
    driver: local

networks:
  avatar-network:
    driver: bridge
